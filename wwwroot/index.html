<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#03173d" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
    <title>DND</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <script>
        // Applies the theme before any stylesheet is parsed, so there is no light-mode flash
        // while the Blazor WASM runtime downloads and boots. Deliberately reads localStorage
        // (not IndexedDB, ticket 208): IndexedDB is always asynchronous and unreadable before
        // first paint, so it cannot do this job. STORAGE_KEY must stay identical to the one in
        // wwwroot/js/theme.js; a mismatch silently breaks persistence.
        (function () {
            var STORAGE_KEY = 'dnd-theme';
            var theme = null;
            try {
                theme = localStorage.getItem(STORAGE_KEY);
            } catch (e) {
                // localStorage throws in some privacy modes; fall back to the OS preference below.
            }
            if (theme !== 'light' && theme !== 'dark') {
                theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
                    ? 'dark'
                    : 'light';
            }
            document.documentElement.dataset.theme = theme;
            document.documentElement.dataset.bsTheme = theme;
        })();
    </script>
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="DND.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' })
                .catch(error => console.error('Service worker registration failed:', error));
        }
    </script>
</body>

</html>
