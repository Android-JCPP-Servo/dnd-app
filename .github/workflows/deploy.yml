name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish DND.csproj -c Release -o release

      - name: Verify publish output layout
        run: |
          ls release/wwwroot || { echo "release/wwwroot not found - publish output layout differs from expected"; exit 1; }

      - name: Rewrite base href for GitHub Pages subpath
        run: |
          sed -i 's|<base href="/" />|<base href="/dnd-app/" />|g' release/wwwroot/index.html
          grep -q '<base href="/dnd-app/" />' release/wwwroot/index.html || { echo "base href rewrite failed to match"; exit 1; }

      - name: Rewrite service worker base path
        run: |
          ls release/wwwroot/service-worker*
          SW_FILE=release/wwwroot/service-worker.js
          grep -q 'const base = "/";' "$SW_FILE" || SW_FILE=release/wwwroot/service-worker.published.js
          grep -q 'const base = "/";' "$SW_FILE" || { echo "could not find 'const base = \"/\";' in either service-worker output file"; exit 1; }
          sed -i 's|const base = "/";|const base = "/dnd-app/";|g' "$SW_FILE"
          grep -q 'const base = "/dnd-app/";' "$SW_FILE" || { echo "service worker base rewrite failed to match"; exit 1; }

      - name: Generate 404.html from rewritten index.html
        run: cp release/wwwroot/index.html release/wwwroot/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
